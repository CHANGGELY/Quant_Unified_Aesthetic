# GitHub Actions - Python CI
#
# 这个 CI 是干嘛的？
#   每次你 push 或提 PR，GitHub 会自动跑一遍“离线可重复”的单元测试，
#   这样你就不会把明显的报错带进主分支。
#
# 注意：
#   - 我们只跑“白名单测试入口”：Quant_Unified/测试用例/运行CI测试.py
#   - 避免误跑需要 API Key 的脚本（比如策略目录里的 test_api.py）
#
# Python 版本选择：
#   - 生产/容器（Dockerfile）目前是 Python 3.12
#   - 所以 CI 也用 3.12，确保与部署环境一致

name: python-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies (CI Minimal)
        run: |
          python -m pip install --upgrade pip
          pip install -r Quant_Unified/requirements-ci.txt

      - name: Run Unit Tests
        env:
          PYTHONPATH: Quant_Unified
        run: |
          python -X utf8 Quant_Unified/测试用例/运行CI测试.py
