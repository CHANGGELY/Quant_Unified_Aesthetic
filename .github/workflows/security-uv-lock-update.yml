name: Security uv lock update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/nautilus_trader
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      - name: Install uv
        run: pip install uv
      - name: Regenerate lock (protobuf)
        run: uv lock --upgrade-package protobuf
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock pyproject.toml
          git diff --cached --quiet || (git commit -m "security(deps): uv lock 重算 protobuf→5.29.6" && git push)
